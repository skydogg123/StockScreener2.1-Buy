yaml
name: Daily stock screen

on:
  schedule:
    # 22:00 UTC = 5:00 PM Central Daylight Time (summer).
    # Central switches to Standard Time (UTC-6) in winter, which shifts this
    # to 4:00 PM CST. GitHub Actions cron does not auto-adjust for DST, so
    # if you want a fixed 5:00 PM Central year-round, change this to
    # "0 23 * * *" between early November and early March, or split into
    # two schedule entries with month ranges.
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # lets you manually trigger a test run from the Actions tab

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python stock_screen.py
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.REC
